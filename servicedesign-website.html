<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서비스설계소 | 기획부터 개발, 유지보수까지</title>
<meta name="description" content="15년차 서비스·플랫폼 기획자가 기획서, 화면설계서, 디자인, 개발, 유지보수까지 한 팀으로 맡습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --font: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --paper: #F4F5F2; --surface: #FFFFFF; --ink: #17202B; --muted: #525C66;
  --line: #D3D8D2; --line-strong: #AEB5AD; --wire: #EEF0EC; --wire-bar: #C9CFC8;
  --accent: #2446D8; --accent-hover: #1A34A8; --accent-ink: #1A34A8; --accent-soft: #E6EBFC; --on-accent: #FFFFFF;
  --marker: #F4C542; --on-marker: #17202B;
  --dark: #17202B; --dark-text: #EEF0EC; --dark-muted: #AEB6BF; --dark-line: #3A4552; --dark-accent: #9DB0FF;
  --ok-bg: #E3F1E6; --ok-fg: #1F6B35; --wait-bg: #EEF0EC; --wait-fg: #525C66; --err: #B42318;
  --shadow: 0 10px 30px rgba(23, 32, 43, 0.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171E; --surface: #1A212A; --ink: #E8ECEF; --muted: #A3ADB7;
    --line: #2C3540; --line-strong: #4A5561; --wire: #232B34; --wire-bar: #3D4854;
    --accent: #8CA5FF; --accent-hover: #A9BCFF; --accent-ink: #B4C4FF; --accent-soft: #1F2A4A; --on-accent: #0C1015;
    --marker: #E9BE45; --on-marker: #17202B;
    --dark: #0C1015; --dark-text: #E8ECEF; --dark-muted: #A3ADB7; --dark-line: #2C3540; --dark-accent: #A9BCFF;
    --ok-bg: #1B3325; --ok-fg: #93D9A8; --wait-bg: #232B34; --wait-fg: #A3ADB7; --err: #FF8F80;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  --paper: #12171E; --surface: #1A212A; --ink: #E8ECEF; --muted: #A3ADB7;
  --line: #2C3540; --line-strong: #4A5561; --wire: #232B34; --wire-bar: #3D4854;
  --accent: #8CA5FF; --accent-hover: #A9BCFF; --accent-ink: #B4C4FF; --accent-soft: #1F2A4A; --on-accent: #0C1015;
  --marker: #E9BE45; --on-marker: #17202B;
  --dark: #0C1015; --dark-text: #E8ECEF; --dark-muted: #A3ADB7; --dark-line: #2C3540; --dark-accent: #A9BCFF;
  --ok-bg: #1B3325; --ok-fg: #93D9A8; --wait-bg: #232B34; --wait-fg: #A3ADB7; --err: #FF8F80;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
img, svg { max-width: 100%; }
a { color: var(--accent-ink); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 40px); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }

/* header */
.site-header { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
.header-in { height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--ink); text-decoration: none; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.brand .mark-dot { fill: var(--accent); }
.brand .mark-line { stroke: var(--ink); }
.nav { display: flex; align-items: center; gap: 28px; }
.nav a:not(.btn) { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 500; }
.nav a:not(.btn):hover { text-decoration: underline; text-underline-offset: 5px; }
.nav a[aria-current="page"]:not(.btn) { color: var(--accent-ink); font-weight: 700; }
.menu-btn { display: none; width: 44px; height: 44px; align-items: center; justify-content: center; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); cursor: pointer; }
.menu-btn path { stroke: var(--ink); }
@media (max-width: 960px) {
  .menu-btn { display: inline-flex; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 72px; flex-direction: column; align-items: stretch; gap: 0; padding: 8px clamp(20px, 5vw, 40px) 20px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
  .nav.open { display: flex; }
  .nav a:not(.btn) { min-height: 52px; border-bottom: 1px solid var(--line); font-size: 17px; }
  .nav .btn { margin-top: 16px; }
}

/* buttons and controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 6px; border: 1px solid transparent; font-size: 16px; font-weight: 600; line-height: 1.2; text-decoration: none; cursor: pointer; transition: background-color 120ms ease; white-space: nowrap; }
.btn-p { background: var(--accent); color: var(--on-accent); }
.btn-p:hover { background: var(--accent-hover); color: var(--on-accent); }
.btn-s { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-s:hover { background: var(--wire); color: var(--ink); }
.btn-o { background: var(--surface); color: var(--accent-ink); border-color: var(--accent); }
.btn-o:hover { background: var(--accent-soft); }
.btn-w { background: #FFFFFF; color: #17202B; }
.btn-w:hover { background: #E6EBFC; color: #17202B; }
.btn-lg { min-height: 56px; padding: 0 28px; font-size: 17px; }
.btn-sm { min-height: 44px; padding: 0 18px; font-size: 15px; }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.linkbtn { display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: none; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 10px; }
.pill { min-height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 500; cursor: pointer; }
.pill:hover { border-color: var(--accent); }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label, .legend { font-size: 16px; font-weight: 600; }
.input { width: 100%; min-height: 52px; padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 16px; }
textarea.input { min-height: 120px; line-height: 1.6; resize: vertical; }
select.input { appearance: auto; }
.input::placeholder { color: #6B747D; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex-shrink: 0; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 12px; }
.error { color: var(--err); font-size: 15px; font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(22px, 3vw, 36px); }
.card-strong { border: 2px solid var(--accent); }
.badge { display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.badge-ok { background: var(--ok-bg); color: var(--ok-fg); }
.badge-wait { background: var(--wait-bg); color: var(--wait-fg); }
.badge-acc { background: var(--accent-soft); color: var(--accent-ink); }
.note { padding: 14px 18px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); font-size: 15px; line-height: 1.6; }

/* sections */
.sec { padding: clamp(64px, 8vw, 104px) 0; }
.sec-white { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.sec-dark { background: var(--dark); color: var(--dark-text); }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 60px; margin-bottom: clamp(36px, 5vw, 56px); }
.sec-head p { max-width: 560px; font-size: 18px; line-height: 1.7; color: var(--muted); }
.sec-dark .sec-head p { color: var(--dark-muted); }
.h-display { font-size: clamp(34px, 4.4vw, 56px); line-height: 1.26; font-weight: 700; letter-spacing: -0.03em; }
.h-page { font-size: clamp(34px, 4vw, 52px); line-height: 1.25; font-weight: 700; letter-spacing: -0.03em; }
.h-sec { font-size: clamp(28px, 3vw, 40px); line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; }
.page-head { padding: clamp(48px, 6vw, 80px) 0 32px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 60px; }
.page-head p { max-width: 580px; font-size: 18px; line-height: 1.7; color: var(--muted); }
main:focus { outline: none; }
h1:focus { outline: none; }

/* hero */
.hero { padding: clamp(48px, 6vw, 80px) 0 clamp(64px, 8vw, 104px); display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 56px; }
.hero-copy { flex: 1 1 420px; max-width: 580px; display: flex; flex-direction: column; gap: 28px; padding-top: 12px; }
.hero-copy .lead { font-size: 19px; line-height: 1.75; color: var(--muted); }
.hero-copy .fine { font-size: 15px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.sheet { flex: 0 1 600px; min-width: 300px; background: var(--surface); border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; }
.sheet-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--ink); }
.sheet-meta div { padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); }
.sheet-meta div:last-child { border-right: 0; }
.sheet-meta span:first-child { font-size: 12px; color: var(--muted); }
.sheet-meta span:last-child { font-size: 14px; font-weight: 600; }
.sheet-body { display: flex; flex-wrap: wrap; }
.sheet-wire { flex: 1 1 290px; background: var(--wire); padding: 32px 0; display: flex; justify-content: center; }
.phone { width: 232px; height: 440px; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 26px; padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.bar { height: 8px; border-radius: 2px; background: var(--wire-bar); }
.bar-ink { height: 13px; border-radius: 2px; background: var(--ink); }
.w-grid { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.w-box { height: 48px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 10px; }
.w-box.on { border: 2px solid var(--accent); background: var(--accent-soft); padding: 9px; }
.w-box.on .bar { background: var(--accent); }
.w-rel { position: relative; }
.w-radio { display: flex; align-items: center; gap: 8px; }
.w-dot { width: 12px; height: 12px; border-radius: 6px; border: 1px solid var(--line-strong); }
.w-dot.on { border: 4px solid var(--ink); }
.w-img { height: 76px; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.w-img line { stroke: var(--wire-bar); }
.w-btn { height: 40px; border-radius: 6px; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.marker { position: absolute; left: -34px; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: var(--marker); color: var(--on-marker); font-size: 13px; font-weight: 700; cursor: pointer; }
.marker[aria-pressed="true"], .desc-item[aria-pressed="true"] .num { background: var(--accent); color: var(--on-accent); }
.sheet-desc { flex: 1 1 260px; border-left: 1px solid var(--line); padding: 20px 14px 24px; display: flex; flex-direction: column; gap: 4px; }
.sheet-desc > span { padding: 0 10px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.desc-item { display: flex; gap: 12px; padding: 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }
.desc-item[aria-pressed="true"] { background: var(--accent-soft); }
.desc-item .num { flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; background: var(--marker); color: var(--on-marker); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.desc-item b { display: block; font-size: 14px; font-weight: 600; }
.desc-item small { display: block; margin-top: 4px; font-size: 13px; line-height: 1.55; color: var(--muted); }

/* stages */
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 48px 40px; }
.stage { position: relative; border-top: 2px solid var(--ink); padding-top: 28px; display: flex; flex-direction: column; gap: 12px; }
.stage::before { content: ''; position: absolute; left: 0; top: -12px; width: 22px; height: 22px; border-radius: 11px; border: 2px solid var(--ink); background: var(--surface); }
.stage h3 { font-size: 24px; font-weight: 700; }
.stage ul { list-style: none; margin: 6px 0 0; padding: 0; border-bottom: 1px solid var(--line); }
.stage li { padding: 12px 0; border-top: 1px solid var(--line); }
.stage .from { margin-top: 6px; font-size: 20px; font-weight: 700; }
.callout { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px 40px; margin-top: 56px; padding: 28px 32px; border-radius: 8px; background: var(--accent-soft); }
.callout p { flex: 1 1 420px; font-size: 18px; line-height: 1.6; }

/* process */
.process { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 32px 24px; }
.process li { border-top: 1px solid var(--dark-line); padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
.process .n { font-size: 15px; font-weight: 700; color: var(--dark-accent); }
.process b { font-size: 19px; font-weight: 600; color: var(--dark-text); }
.process span:last-child { font-size: 15px; line-height: 1.65; color: var(--dark-muted); }

/* work */
.thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px 28px; }
.thumb { display: flex; flex-direction: column; gap: 14px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink); }
.thumb-img { display: block; width: 100%; aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; transition: border-color 120ms ease; }
.thumb:hover .thumb-img { border-color: var(--ink); }
.thumb-img svg { display: block; width: 100%; height: 100%; }
.thumb b { font-size: 19px; font-weight: 600; }
.thumb small { font-size: 15px; line-height: 1.6; color: var(--muted); }
.s-surface { fill: var(--surface); } .s-wire { fill: var(--wire); } .s-bar { fill: var(--wire-bar); } .s-ink { fill: var(--ink); }
.s-acc { fill: var(--accent); } .s-soft { fill: var(--accent-soft); } .s-mark { fill: var(--marker); }
.k-line { stroke: var(--line-strong); fill: none; } .k-ink { stroke: var(--ink); fill: none; } .k-acc { stroke: var(--accent); fill: none; }
dialog { width: min(920px, calc(100% - 32px)); max-height: calc(100% - 48px); padding: 0; border: 0; border-radius: 12px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(12, 16, 21, 0.55); }
.dlg { display: flex; flex-wrap: wrap; }
.dlg-img { flex: 1 1 380px; background: var(--wire); padding: 28px; display: flex; align-items: center; }
.dlg-img .thumb-img { border-color: var(--line-strong); }
.dlg-body { flex: 1 1 320px; padding: 32px; display: flex; flex-direction: column; gap: 16px; position: relative; }
.dlg-body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.dlg-close { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; cursor: pointer; }
.dlg-close:hover { background: var(--wire); }
.dlg-close path { stroke: var(--ink); }

/* principles, faq */
.split { display: flex; flex-wrap: wrap; gap: 64px 80px; }
.rules { flex: 1 1 520px; }
.rules > div { padding: 28px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.rules > div:last-child { border-bottom: 1px solid var(--line); }
.rules h3 { font-size: 21px; font-weight: 600; }
.rules p { font-size: 17px; line-height: 1.75; color: var(--muted); }
.about { flex: 1 1 340px; max-width: 460px; display: flex; flex-direction: column; gap: 20px; }
.monogram { aspect-ratio: 4 / 3; border-radius: 8px; background: var(--ink); color: var(--paper); display: flex; align-items: flex-end; padding: 28px; font-size: clamp(40px, 5vw, 64px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
.faq { flex: 1 1 520px; border-bottom: 1px solid var(--line); }
.faq details { border-top: 1px solid var(--line); }
.faq summary { list-style: none; min-height: 76px; padding: 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 19px; font-weight: 600; cursor: pointer; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary svg { flex-shrink: 0; transition: transform 150ms ease; }
.faq summary path { stroke: var(--ink); }
.faq details[open] summary svg { transform: rotate(45deg); }
.faq details p { padding: 0 48px 28px 0; font-size: 17px; line-height: 1.75; color: var(--muted); }
.band { background: var(--accent); color: var(--on-accent); }
.band .wrap { padding-top: clamp(64px, 8vw, 96px); padding-bottom: clamp(64px, 8vw, 96px); display: flex; flex-direction: column; align-items: flex-start; gap: 20px; }
.band h2 { max-width: 760px; }
.band p { font-size: 19px; line-height: 1.7; opacity: 0.9; }

/* services */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.tab { display: inline-flex; align-items: center; min-height: 50px; padding: 0 24px; border-radius: 25px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 17px; font-weight: 600; text-decoration: none; }
.tab:hover { border-color: var(--accent); }
.tab[aria-current="page"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 clamp(20px, 3vw, 40px); margin-top: 24px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; padding: 24px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-main { flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px; }
.row-main b { font-size: 18px; font-weight: 600; }
.row-main span { font-size: 15px; line-height: 1.6; color: var(--muted); }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; }
.kv { display: flex; flex-direction: column; gap: 2px; }
.kv small { font-size: 13px; color: var(--muted); }
.kv span { font-size: 16px; }
.kv strong { font-size: 18px; }
.est { margin-top: clamp(48px, 6vw, 72px); background: var(--surface); border: 2px solid var(--ink); border-radius: 10px; padding: clamp(24px, 3vw, 40px); display: flex; flex-wrap: wrap; gap: 32px 56px; }
.est-form { flex: 1 1 420px; display: flex; flex-direction: column; gap: 24px; }
.est-out { flex: 1 1 300px; padding: 32px; border-radius: 8px; background: var(--paper); display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.est-out .amount { font-size: clamp(36px, 4vw, 48px); line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px 56px; }
.facts h2 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
.facts p { font-size: 16px; line-height: 1.75; color: var(--muted); }

/* quote */
.q-layout { padding: clamp(40px, 5vw, 64px) 0 clamp(64px, 8vw, 96px); display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px 72px; }
.q-side { flex: 0 1 300px; min-width: 260px; display: flex; flex-direction: column; gap: 32px; }
.q-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.q-steps li { display: flex; align-items: center; gap: 14px; font-size: 17px; color: var(--muted); }
.q-steps .c { width: 32px; height: 32px; border-radius: 16px; background: var(--wire); color: var(--muted); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  function viewServices(slug) {

      return '<div class="row"><div class="row-main"><b>' + r.name + '</b><span>' + r.detail + '</span></div><div class="row-meta">' +
        '<div class="kv" style="width:110px"><small>기간</small><span>' + r.period + '</span></div>' +

        '<div class="kv" style="width:170px"><small>가격</small><strong>' + r.price + '</strong></div>' +

        '</div></div>';

    var e = state.est;

    return '<div class="wrap">' +
      '<section class="page-head"><h1 class="h-page" tabindex="-1">서비스와 가격</h1><p>단계를 고르면 상품별 구성과 시작 가격을 볼 수 있습니다. 정확한 금액은 무료 상담 후 견적서로 드립니다.</p></section>' +
      '<nav class="tabs" aria-label="서비스 단계">' + tabs + '</nav>' +
      '<p style="font-size:18px">' + tab.desc + '</p>' +
      '<div class="rows">' + rows + '</div>' +
      '<section class="est" aria-labelledby="estTitle">' +
        '<div class="est-form">' +
          '<div><h2 id="estTitle" style="font-size:26px;font-weight:700;margin-bottom:8px">화면설계서 예상 금액 계산</h2><p class="muted">조건을 고르면 대략적인 금액을 바로 보여드립니다. 실제 금액은 상담 후 견적서로 확정합니다.</p></div>' +
          '<fieldset><legend class="legend">분량</legend><div class="pills">' + sizes.map(function (s, i) {
            return '<button type="button" class="pill" id="es' + i + '" data-act="estSize" data-i="' + i + '" aria-pressed="' + (e.size === i) + '">' + s + '</button>';
          }).join('') + '</div></fieldset>' +
          '<div>' +
            '<label class="check"><input type="checkbox" id="estAdmin" data-est="admin"' + (e.admin ? ' checked' : '') + '>관리자 화면도 함께 설계</label>' +
            '<label class="check"><input type="checkbox" id="estProto" data-est="proto"' + (e.proto ? ' checked' : '') + '>클릭해 볼 수 있는 프로토타입 추가</label>' +
            '<label class="check"><input type="checkbox" id="estRush" data-est="rush"' + (e.rush ? ' checked' : '') + '>기본 일정보다 빠르게 필요</label>' +
          '</div>' +
        '</div>' +
        '<div class="est-out"><span class="muted">예상 금액 (부가세 별도)</span><span class="amount" aria-live="polite">약 ' + won(calc.amount) + '</span><span class="muted" style="font-size:15px">' + esc(calc.note) + ' 기준입니다.</span>' +
          '<button type="button" class="btn btn-p" data-act="askEstimate" style="align-self:flex-start;margin-top:12px">이 조건으로 견적 문의</button></div>' +
      '</section>' +
    '</div>' +
    '<section class="sec sec-white" style="margin-top:clamp(64px,8vw,96px)"><div class="wrap facts">' +
      '<div><h2>가격 기준</h2><p>모든 가격은 부가세 별도 시작 가격입니다. 화면 수, 기능 수, 일정에 따라 금액이 달라지며 무료 상담 후 견적서로 확정합니다.</p></div>' +
      '<div><h2>대금 나누기</h2><p>300만 원 이하 문서 작업은 착수 50%, 납품 50%입니다. 개발은 착수 30%, 디자인 확정 40%, 완료 30%로 나눕니다. 입금이 확인되면 세금계산서를 발행합니다.</p></div>' +
      '<div><h2>이어서 맡기면</h2><p>기획을 맡긴 뒤 개발까지 이어가면 기획비의 20%를 개발비에서 빼드립니다. 개발 완료 후 1개월은 무상으로 오류를 수정합니다.</p></div>' +
    '</div></section>';
  }
  function estimate() {
    var e = state.est;
    var sizes = ['40쪽 이내', '100쪽 이내', '200쪽 이내'];
    var amount = [200, 400, 700][e.size];
    if (e.admin) amount *= 1.3;
    if (e.proto) amount += [150, 300, 500][e.size];
    if (e.rush) amount *= 1.2;
    amount = Math.round(amount / 10) * 10;
    var parts = ['화면설계서 ' + sizes[e.size]];
    if (e.admin) parts.push('관리자 화면 포함');
    if (e.proto) parts.push('프로토타입 포함');
    if (e.rush) parts.push('일정 단축');
    return { amount: amount, note: parts.join(', ') };
  }

  function summaryRows(p) {
    var rows = [
      ['프로젝트', p.projectName || '이름 없음'],
      ['서비스', (p.services || []).map(svcLabel).join(', ')],
      ['선택한 상품', p.fromProduct || '선택하지 않음'],
      ['지금 상황', p.situation || '선택하지 않음'],
      ['예산', p.budget || '상담 후 결정'],
      ['희망 일정', p.timeline || '일정 협의 가능'],
      ['받을 형식', (p.formats && p.formats.length) ? p.formats.join(', ') : '상담 때 정하기'],
      ['정부지원사업', p.gov ? '예' : '아니요'],
      ['세금계산서', p.taxInvoice ? '발행 필요' : '필요 없음']
    ];
    if (p.desc) rows.splice(1, 0, ['서비스 설명', p.desc]);

  function svcLabel(id) { var s = SERVICES.filter(function (x) { return x.id === id; })[0]; return s ? s.label : id; }

  function qNext() {
    var f = state.form;
    if (f.step === 1 && f.services.length === 0) { f.error = '필요한 서비스를 하나 이상 고르세요.'; render(); return; }
    if (f.step === 3) {
      if (!f.name.trim()) { f.error = '이름을 입력하세요.'; render(); focusId('f-name'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) { f.error = '연락받을 이메일 주소를 정확히 입력하세요.'; render(); focusId('f-email'); return; }
      if (!f.agree) { f.error = '개인정보 수집과 이용에 동의해야 문의를 보낼 수 있습니다.'; render(); return; }
      submitQuote();
      return;
    }
    f.error = '';
    f.step += 1;
    render();
    scrollToCard();
  }
  function submitQuote() {
    var f = state.form;
    if (state.busy) return;
    if (store.mode === 'pending') { f.error = '페이지를 준비하는 중입니다. 잠시 후 다시 눌러주세요.'; render(); return; }
    var id = newInquiryId();
    var now = new Date().toISOString();
    var item = {
      id: id, createdAt: now, status: 'received',
      services: f.services.slice(), fromProduct: f.fromProduct, situation: f.situation,
      projectName: f.projectName.trim(), desc: f.desc.trim(), budget: f.budget, timeline: f.timeline,
      formats: f.formats.slice(), gov: f.gov, taxInvoice: f.taxInvoice,
      slot: '', quoteAmount: null, message: ''
    };
    var customer = { name: f.name.trim(), company: f.company.trim(), email: f.email.trim(), phone: f.phone.trim() };
    state.busy = true; f.error = ''; render();
    writeItem(store.uid || 'local', id, item, customer).then(function () {
      state.busy = false;
      state.lastSubmitted = item;
      var keep = { name: f.name, company: f.company, email: f.email, phone: f.phone };
      state.form = Object.assign(blankForm(), keep, { step: 4 });
      render();
      scrollToCard();
      toast('견적 문의를 보냈습니다');
    }).catch(function (err) {
      state.busy = false;
      f.error = (err && err.code === 'quota_exceeded') ? '저장 공간이 가득 차 문의를 보낼 수 없습니다. 이메일로 문의해 주세요.' : '문의를 저장하지 못했습니다. 잠시 후 다시 보내주세요.';

  function scrollToCard() {

  /* ---------- 화면: 내 프로젝트 ---------- */
  function timeline(item) {
    var st = STATUS[item.status] || STATUS.received;
    var cur = item.status === 'closed' ? 6 : st.step;
    return '<ol class="tl">' + STEP_LABELS.map(function (l, i) {
      var cls = i < cur ? 'done' : (i === cur ? 'cur' : '');
      var s = i < cur ? '완료' : (i === cur ? '진행 중' : '대기');
      if (i === 1 && cur === 1) s = st.customer;
      return '<li class="' + cls + '"' + (i === cur ? ' aria-current="step"' : '') + '><span class="d">' + (i + 1) + '</span><span class="t"><b>' + l + '</b><span>' + s + '</span></span></li>';
    }).join('') + '</ol>';
  }
  function docRows(item) {
    var k = statusIdx(item.status);
    function row(name, detail, ok, label) {
      return '<div class="doc-row"><div><b>' + name + '</b><span>' + detail + '</span></div><span class="badge ' + (ok ? 'badge-ok' : 'badge-wait') + '">' + label + '</span></div>';
    }
    var amount = item.quoteAmount ? won(item.quoteAmount) + ', 부가세 별도' : '견적서에서 확정';
    return row('견적서', amount, k >= 2, k >= 2 ? '발송됨' : '상담 후 발송') +
      row('용역 계약서', '전자서명으로 체결', k >= 4, k >= 4 ? '서명 완료' : (k === 3 ? '서명 대기' : '대기')) +
      row('착수금', '계약 후 요청서와 함께 안내', k >= 4, k >= 4 ? '입금 확인' : '대기') +
      row('잔금', '최종 납품 후 요청', k >= 6, k >= 6 ? '입금 확인' : (k === 5 ? '입금 요청' : '대기')) +
      row('세금계산서', '전자세금계산서로 발행', k >= 6, k >= 6 ? '발행 완료' : (k >= 4 ? '착수금분 발행' : '입금 후 발행'));
  }
  function actionCard(item) {

      var pick = state.slotPick[item.id] || item.slot || '';

        '<div><h2 id="actTitle" style="font-size:24px;font-weight:700">무료 상담 시간을 골라주세요</h2><p class="muted" style="margin-top:8px;line-height:1.7">20~30분 화상으로 진행합니다. 맞는 시간이 없다면 ' + esc(SITE.email) + '로 알려주세요.</p></div>' +

        }).join('') + '</div>' +

        '<button type="button" class="btn btn-p" data-act="bookSlot" data-id="' + esc(item.id) + '" style="align-self:flex-start">상담 예약하기</button>' + msg +
      '</section>';
    }
    var map = {
      booked: ['상담을 ' + esc(item.slot) + '로 예약했습니다', '화상 회의 링크는 상담 하루 전에 이메일로 보내드립니다. 상담이 끝나면 3영업일 안에 이 화면에 견적서가 올라옵니다.', '<button type="button" class="btn btn-s btn-sm" data-act="changeSlot" data-id="' + esc(item.id) + '">시간 변경</button>'],
      quoted: ['견적서가 도착했습니다', '견적 금액은 ' + (item.quoteAmount ? won(item.quoteAmount) : '견적서 참고') + '(부가세 별도)입니다. 내용을 확인한 뒤 수락하면 계약서를 보내드립니다.', '<button type="button" class="btn btn-p" data-act="acceptQuote" data-id="' + esc(item.id) + '">견적 수락</button>'],
      accepted: ['계약서 서명을 기다리고 있습니다', '이메일로 보낸 전자계약서에 서명하고 착수금을 입금하면 작업을 시작합니다.', ''],
      contracted: ['작업을 진행하고 있습니다', '중간 산출물이 올라오면 이메일로 알려드립니다. 계약된 횟수 안에서 수정을 요청할 수 있습니다.', ''],
      delivered: ['최종 산출물을 납품했습니다', '잔금 입금이 확인되면 세금계산서를 발행합니다. 납품 후 1개월 동안 오류는 무상으로 고칩니다.', ''],
      closed: ['프로젝트가 끝났습니다', '함께해 주셔서 감사합니다. 운영 중 수정이나 개선이 필요하면 유지보수로 문의해 주세요.', '<button type="button" class="btn btn-o" data-act="askMaint">유지보수 문의</button>']
    };
    var m = map[s] || map.booked;
    return '<section class="card card-strong" style="display:flex;flex-direction:column;gap:14px"><h2 style="font-size:24px;font-weight:700">' + m[0] + '</h2><p class="muted" style="line-height:1.7" role="status">' + m[1] + '</p>' + (m[2] ? '<div class="actions">' + m[2] + '</div>' : '') + msg + '</section>';
  }

  /* ---------- 화면: 관리자 ---------- */
  function viewAdmin(uid, id) {
    var head = '<section class="page-head" style="padding-bottom:0"><h1 class="h-page" tabindex="-1">문의 관리</h1><p>들어온 견적 문의를 확인하고 상태와 견적 금액을 바꿉니다. 바꾼 내용은 고객의 내 프로젝트 화면에 바로 보입니다.</p></section>';

    if (!store.isAdmin) {
      return '<div class="wrap"><div class="card empty" style="margin:72px 0 120px"><h1 class="h-sec" tabindex="-1">관리자만 볼 수 있는 페이지입니다</h1><p class="muted" style="font-size:17px">이 페이지는 사이트를 편집할 수 있는 사람에게만 열립니다.</p><a class="btn btn-s" href="#/">홈으로</a></div></div>';
    }
    var rows = adminRows();
    var counts = { all: rows.length };
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    var inProgress = 0, won_ = 0;
    rows.forEach(function (r) {
      counts[r.item.status] = (counts[r.item.status] || 0) + 1;
      var k = statusIdx(r.item.status);
      if (k >= 3 && k <= 5) inProgress++;
      if (k >= 3 && r.item.quoteAmount) won_ += Number(r.item.quoteAmount) || 0;
    });
    var stats = '<div class="stats">' +
      '<div class="stat"><small>새 문의</small><strong>' + counts.received + '건</strong></div>' +
      '<div class="stat"><small>상담과 견적 단계</small><strong>' + (counts.booked + counts.quoted) + '건</strong></div>' +
      '<div class="stat"><small>계약 후 진행 중</small><strong>' + inProgress + '건</strong></div>' +
      '<div class="stat"><small>수주 금액 합계</small><strong>' + won(won_) + '</strong></div>' +
    '</div>';
    var filters = [['all', '전체']].concat(STATUS_ORDER.map(function (s) { return [s, STATUS[s].label]; }));
    var filterHtml = '<div class="pills" role="group" aria-label="상태로 거르기" style="margin-bottom:16px">' + filters.map(function (fl) {
      return '<button type="button" class="pill" id="flt-' + fl[0] + '" data-act="adminFilter" data-val="' + fl[0] + '" aria-pressed="' + (state.adminFilter === fl[0]) + '" style="min-height:40px;font-size:14px">' + fl[1] + ' ' + (counts[fl[0]] || 0) + '</button>';
    }).join('') + '</div>';
    var shown = rows.filter(function (r) { return state.adminFilter === 'all' || r.item.status === state.adminFilter; });
    var active = rows.filter(function (r) { return r.uid === uid && r.item.id === id; })[0] || shown[0];
    var list = shown.length ? shown.map(function (r) {
      var st = STATUS[r.item.status] || STATUS.received;
      var isAct = active && r.uid === active.uid && r.item.id === active.item.id;
      return '<a class="pitem" href="#/admin/' + encodeURIComponent(r.uid) + '/' + encodeURIComponent(r.item.id) + '"' + (isAct ? ' aria-current="true"' : '') + '><b>' + esc(r.item.projectName || (r.item.services || []).map(svcLabel).join(', ')) + '</b><span><span>' + esc(r.customer.name || '이름 없음') + (r.customer.company ? ', ' + esc(r.customer.company) : '') + '</span><span class="badge ' + (r.item.status === 'received' ? 'badge-acc' : 'badge-wait') + '" style="min-height:24px;font-size:13px">' + st.label + '</span></span></a>';
    }).join('') : '<p class="muted">해당하는 문의가 없습니다.</p>';

    var detail = '<div class="card empty"><h2>아직 들어온 문의가 없습니다</h2><p class="muted">견적 문의 페이지에서 문의가 들어오면 이곳에 표시됩니다.</p></div>';
    if (active) {
      var key = active.uid + '/' + active.item.id;
      var d = state.drafts[key] || { status: active.item.status, quoteAmount: active.item.quoteAmount || '', message: active.item.message || '' };
      state.drafts[key] = d;
      var c = active.customer;
      detail = '<div class="main-stack">' +
        '<div style="display:flex;flex-direction:column;gap:8px"><span class="badge badge-acc" style="align-self:flex-start">' + (STATUS[active.item.status] || STATUS.received).label + '</span><h2 class="h-sec" style="font-size:clamp(24px,3vw,32px)">' + esc(active.item.projectName || '이름 없는 프로젝트') + '</h2><p class="muted">문의번호 ' + esc(active.item.id) + ', ' + fmtDate(active.item.createdAt) + ' 접수' + (active.item.slot ? ', 상담 희망 ' + esc(active.item.slot) : '') + '</p></div>' +
        '<section class="card card-strong" style="display:flex;flex-direction:column;gap:20px"><h3 style="font-size:20px;font-weight:700">진행 상태 바꾸기</h3>' +
          '<div class="grid2">' +
            '<div class="field"><label for="ad-status">상태</label><select class="input" id="ad-status" data-draft="status" data-key="' + esc(key) + '">' + STATUS_ORDER.map(function (s) { return '<option value="' + s + '"' + (d.status === s ? ' selected' : '') + '>' + STATUS[s].label + '</option>'; }).join('') + '</select></div>' +
            '<div class="field"><label for="ad-amount">견적 금액 (만 원, 부가세 별도)</label><input class="input" id="ad-amount" data-draft="quoteAmount" data-key="' + esc(key) + '" type="text" inputmode="numeric" maxlength="7" value="' + esc(d.quoteAmount) + '" placeholder="예: 400"></div>' +
          '</div>' +
          '<div class="field"><label for="ad-msg">고객에게 보일 메시지</label><textarea class="input" id="ad-msg" data-draft="message" data-key="' + esc(key) + '" maxlength="1000" placeholder="예: 상담 내용을 반영해 화면설계서 Standard로 견적서를 올렸습니다.">' + esc(d.message) + '</textarea></div>' +
          (state.adminError ? '<p class="error" role="alert">' + esc(state.adminError) + '</p>' : '') +
          '<button type="button" class="btn btn-p" data-act="adminSave" data-uid="' + esc(active.uid) + '" data-id="' + esc(active.item.id) + '" style="align-self:flex-start"' + (state.busy ? ' disabled' : '') + '>' + (state.busy ? '저장하는 중' : '저장하고 고객에게 반영') + '</button>' +
        '</section>' +
        '<section class="card"><h3 style="font-size:19px;font-weight:700;margin-bottom:12px">고객 정보</h3><dl class="summary">' +
          [['이름', c.name], ['회사명', c.company || '없음'], ['이메일', c.email], ['연락처', c.phone || '없음']].map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') +
          (c.email ? '<div><dt>바로 연락</dt><dd><a href="mailto:' + esc(c.email) + '">이메일 보내기</a></dd></div>' : '') +
        '</dl></section>' +
        '<section class="card"><h3 style="font-size:19px;font-weight:700;margin-bottom:12px">문의 내용</h3><dl class="summary">' + summaryRows(active.item) + '</dl></section>' +
      '</div>';
    }
    var demoNote = store.demo ? '<p class="note" style="margin-top:24px">데모 모드입니다. 문의는 이 브라우저에만 저장되고, 관리자 페이지도 누구나 열 수 있습니다. 실제로 운영할 때는 서버 저장소와 관리자 로그인을 연결해야 합니다.</p>' : '';
    return '<div class="wrap">' + head + demoNote +
      '<div style="padding-top:32px">' + stats + '</div>' +
      '<div class="two two-wide" style="padding-top:24px">' +
        '<section class="card" style="padding:24px"><h2 style="font-size:17px;font-weight:700;margin-bottom:14px">문의 목록</h2>' + filterHtml + '<div class="plist">' + list + '</div></section>' +
        detail +
      '</div></div>';
  }

  /* ---------- 화면: 약관, 개인정보, 404 ---------- */
  function viewPrivacy() {
    return '<div class="wrap"><article class="legal">' +
      '<h1 class="h-page" tabindex="-1">개인정보처리방침</h1>' +
      '<p>' + esc(SITE.company) + '(이하 회사)은 견적 문의와 계약 진행을 위해 필요한 최소한의 개인정보만 수집합니다.</p>' +
      '<section><h2>수집하는 항목</h2><ul><li>필수: 이름, 이메일</li><li>선택: 회사명, 연락처</li><li>문의 과정에서 입력한 프로젝트 설명</li></ul></section>' +
      '<section><h2>이용 목적</h2><p>상담 일정 안내, 견적서 발송, 계약과 대금 청구, 세금계산서 발행에 씁니다.</p></section>' +
      '<section><h2>보관 기간</h2><p>계약하지 않은 문의는 접수일로부터 1년 뒤 파기합니다. 계약한 경우에는 관계 법령이 정한 기간 동안 보관합니다.</p></section>' +
      '<section><h2>제3자 제공</h2><p>법령에 따른 경우를 제외하고 고객의 동의 없이 제3자에게 제공하지 않습니다.</p></section>' +
      '<section><h2>문의처</h2><p>개인정보 관련 문의는 ' + esc(SITE.email) + '로 보내주세요.</p></section>' +
      '<p>시행일: [시행일]</p>' +
    '</article></div>';
  }
  function viewTerms() {
    return '<div class="wrap"><article class="legal">' +
      '<h1 class="h-page" tabindex="-1">이용약관</h1>' +
      '<section><h2>서비스 범위</h2><p>회사는 서비스 기획 문서 작성, 화면설계, 디자인, 개발, 유지보수 용역을 제공합니다. 구체적인 범위와 산출물은 프로젝트마다 견적서와 용역 계약서로 정합니다.</p></section>' +
      '<section><h2>견적과 계약</h2><p>사이트에 표시된 가격은 부가세 별도 시작 가격입니다. 최종 금액과 일정은 무료 상담 후 발송하는 견적서와 계약서를 따릅니다.</p></section>' +
      '<section><h2>수정과 변경</h2><p>계약 범위 안의 수정은 계약서에 정한 횟수만큼 무료입니다. 기능이 추가되거나 범위가 바뀌는 변경은 별도 견적으로 진행합니다.</p></section>' +
      '<section><h2>산출물 권리</h2><p>잔금 입금이 확인되면 산출물의 이용 권리가 고객에게 넘어갑니다. 세부 조건은 계약서를 따릅니다.</p></section>' +
      '<p>시행일: [시행일]</p>' +
    '</article></div>';
  }
  function view404() {
    return '<div class="wrap"><div class="card empty" style="margin:72px 0 120px"><h1 class="h-sec" tabindex="-1">페이지를 찾을 수 없습니다</h1><p class="muted" style="font-size:17px">주소가 바뀌었거나 없는 페이지입니다.</p><a class="btn btn-p" href="#/">홈으로</a></div></div>';
  }

  /* ---------- 라우터와 렌더 ---------- */
  var TITLES = { home: '기획부터 개발, 유지보수까지', services: '서비스와 가격', work: '산출물 예시', quote: '견적 문의', projects: '내 프로젝트', admin: '문의 관리', privacy: '개인정보처리방침', terms: '이용약관', process: '진행 방식' };
  function parseRoute() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean).map(function (p) { try { return decodeURIComponent(p); } catch (e) { return p; } });
    return { name: parts[0] || 'home', args: parts.slice(1) };
  }
  var lastRouteKey = null;
  function render(forceTop) {
    var r = parseRoute();
    var app = document.getElementById('app');
    var active = document.activeElement;
    var focusId_ = active && active.id && app.contains(active) ? active.id : null;
    var selStart = null, selEnd = null;
    try { if (focusId_ && typeof active.selectionStart === 'number') { selStart = active.selectionStart; selEnd = active.selectionEnd; } } catch (e) {}

    var html;
    switch (r.name) {
      case 'home': case 'process': html = viewHome(); break;
      case 'services': html = viewServices(r.args[0]); break;
      case 'work': html = viewWork(); break;
      case 'quote': html = viewQuote(); break;
      case 'projects': html = viewProjects(r.args[0]); break;
      case 'admin': html = viewAdmin(r.args[0], r.args[1]); break;
      case 'privacy': html = viewPrivacy(); break;
      case 'terms': html = viewTerms(); break;
      default: html = view404();
    }
    app.innerHTML = html;

    var navName = r.name === 'home' ? '' : r.name;
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      if (a.getAttribute('data-nav') === navName) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.getElementById('adminLink').hidden = !store.isAdmin;
    document.title = SITE.brand + ' | ' + (TITLES[r.name] || '페이지를 찾을 수 없습니다');

    var key = r.name + '/' + r.args.join('/');
    var routeChanged = key !== lastRouteKey;
    if (routeChanged || forceTop) {
      var pageChanged = !lastRouteKey || lastRouteKey.split('/')[0] !== r.name || r.name === 'process';
      lastRouteKey = key;
      closeMenu();
      if (r.name === 'process') {
        var p = document.getElementById('process');
        if (p) window.scrollTo({ top: window.scrollY + p.getBoundingClientRect().top - 72 });
      } else if (pageChanged || forceTop) {
        window.scrollTo({ top: 0 });
        var h1 = app.querySelector('h1');
        if (h1 && lastRouteKey && document.readyState === 'complete') h1.focus({ preventScroll: true });
      }
    } else if (focusId_) {
      var el = document.getElementById(focusId_);
      if (el) {
        el.focus({ preventScroll: true });
        try { if (selStart !== null) el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
  function focusId(id) { var el = document.getElementById(id); if (el) el.focus(); }

  /* ---------- 이벤트 ---------- */
  var menuBtn = document.getElementById('menuBtn');
  var nav = document.getElementById('nav');
  function closeMenu() { nav.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); menuBtn.setAttribute('aria-label', '메뉴 열기'); }
  menuBtn.addEventListener('click', function () {
    var open = !nav.classList.contains('open');
    nav.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && nav.classList.contains('open')) { closeMenu(); menuBtn.focus(); } });

  var ACTIONS = {
    spec: function (t) { var n = Number(t.dataset.n); state.specOn = state.specOn === n ? 0 : n; render(); },
    openWork: function (t) { openWork(t.dataset.key); },
    closeWork: function () { closeWork(); },
    askWork: function (t) {
      var w = WORK.filter(function (x) { return x.key === t.dataset.key; })[0];
      closeWork();
      state.form = Object.assign(state.form, { step: 1, services: [w.svc], fromProduct: w.product, error: '' });
      go('#/quote');
    },
    askProduct: function (t) {
      state.form = Object.assign(state.form, { step: 1, services: [t.dataset.svc], fromProduct: t.dataset.name, error: '' });
      go('#/quote');
    },
    askEstimate: function () {
      var c = estimate();
      var svcs = ['wireframe'];
      if (state.est.proto) svcs.push('prototype');
      var budget = c.amount < 300 ? '300만 원 미만' : (c.amount < 1000 ? '300만~1,000만 원' : '1,000만~3,000만 원');
      state.form = Object.assign(state.form, { step: 1, services: svcs, budget: budget, fromProduct: c.note + ', 예상 ' + won(c.amount), error: '' });
      go('#/quote');
    },
    askMaint: function () {
      state.form = Object.assign(state.form, { step: 1, services: ['maint'], situation: '운영 중인 서비스예요', fromProduct: '', error: '' });
      go('#/quote');
    },
    estSize: function (t) { state.est.size = Number(t.dataset.i); render(); },
    toggleSvc: function (t) {
      var f = state.form, id = t.dataset.id, i = f.services.indexOf(id);
      if (i >= 0) f.services.splice(i, 1); else f.services.push(id);
      f.error = ''; render();
    },
    pickOne: function (t) { var f = state.form, k = t.dataset.key, v = t.dataset.val; f[k] = f[k] === v ? '' : v; f.error = ''; render(); },
    pickMulti: function (t) { var arr = state.form[t.dataset.key], v = t.dataset.val, i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); render(); },
    qNext: function () { qNext(); },
    qPrev: function () { state.form.error = ''; state.form.step = Math.max(1, state.form.step - 1); render(); scrollToCard(); },
    clearProduct: function () { state.form.fromProduct = ''; render(); },
    newQuote: function () {
      var f = state.form;
      state.form = Object.assign(blankForm(), { name: f.name, company: f.company, email: f.email, phone: f.phone });
      go('#/quote');
    },
    pickSlot: function (t) { state.slotPick[t.dataset.id] = t.dataset.val; state.slotError = null; render(); },
    bookSlot: function (t) {
      var id = t.dataset.id, slot = state.slotPick[id];
      if (!slot) { state.slotError = id; render(); return; }
      state.slotError = null;
      writeItem(store.uid || 'local', id, { slot: slot, status: 'booked' }).then(function () {
        render(); toast('상담을 ' + slot + '로 예약했습니다');
      }).catch(function () { toast('예약을 저장하지 못했습니다. 다시 시도해 주세요.'); });
    },
    changeSlot: function (t) {
      writeItem(store.uid || 'local', t.dataset.id, { status: 'received' }).then(function () { render(); }).catch(function () { toast('변경하지 못했습니다. 다시 시도해 주세요.'); });
    },
    acceptQuote: function (t) {
      writeItem(store.uid || 'local', t.dataset.id, { status: 'accepted' }).then(function () {
        render(); toast('견적을 수락했습니다. 계약서를 보내드립니다');
      }).catch(function () { toast('저장하지 못했습니다. 다시 시도해 주세요.'); });
    },
    adminFilter: function (t) { state.adminFilter = t.dataset.val; render(); },
    adminSave: function (t) {
      var uid = t.dataset.uid, id = t.dataset.id, key = uid + '/' + id;
      var d = state.drafts[key];
      if (!d) return;
      var amt = String(d.quoteAmount || '').replace(/[^0-9]/g, '');
      if (d.status === 'quoted' && !amt) { state.adminError = '견적서 발송 상태로 바꾸려면 견적 금액을 입력하세요.'; render(); return; }
      state.adminError = null; state.busy = true; render();
      writeItem(uid, id, { status: d.status, quoteAmount: amt ? Number(amt) : null, message: String(d.message || '').trim() }).then(function () {
        state.busy = false; delete state.drafts[key]; render(); toast('저장했습니다. 고객 화면에 반영됩니다');
      }).catch(function () {
        state.busy = false; state.adminError = '저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'; render();
      });
    }
  };

  document.addEventListener('click', function (e) {
    var dlg = document.getElementById('workDialog');
    if (e.target === dlg) { closeWork(); return; }
    var t = e.target.closest('[data-act]');
    if (!t) {
      var a = e.target.closest('a[href^="#/"]');
      if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); closeMenu(); render(true); }
      return;
    }
    var fn = ACTIONS[t.dataset.act];
    if (!fn) return;
    if (t.tagName === 'A' && t.dataset.act === 'closeWork') { closeWork(); return; }
    if (t.tagName === 'A') e.preventDefault();
    fn(t, e);
  });
  function onField(e) {
    var t = e.target;
    if (t.dataset.field) {
      var k = t.dataset.field;
      state.form[k] = t.type === 'checkbox' ? t.checked : t.value;
      if (state.form.error && e.type === 'change') { state.form.error = ''; render(); }
    } else if (t.dataset.est) {
      state.est[t.dataset.est] = t.checked; render();
    } else if (t.dataset.draft) {
      var key = t.dataset.key;
      state.drafts[key] = state.drafts[key] || {};
      state.drafts[key][t.dataset.draft] = t.value;
    }
  }
  document.addEventListener('input', function (e) { if (e.target.type !== 'checkbox') onField(e); });
  document.addEventListener('change', function (e) { if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onField(e); });
  window.addEventListener('hashchange', function () { closeWork(); render(); });

  document.getElementById('bizInfo').innerHTML = '<b>' + esc(SITE.brand) + '</b><span>상호 ' + esc(SITE.company) + ', 대표 ' + esc(SITE.ceo) + ', 사업자등록번호 ' + esc(SITE.bizNo) + '</span><span>통신판매업 신고번호 ' + esc(SITE.salesNo) + ', ' + esc(SITE.address) + '</span><span>이메일 ' + esc(SITE.email) + '</span>';

  render();

  /* ---------- 저장소 연결 ---------- */
  var LOCAL_KEY = 'servicedesign-inquiries-v1';
  function loadLocal() {
    try {
      var raw = window.localStorage.getItem(LOCAL_KEY);
      if (raw) { var parsed = JSON.parse(raw); if (parsed && parsed.items) store.mem = parsed; }
      store.persisted = true;
    } catch (e) { store.persisted = false; }
  }
  function saveLocal() {
    if (!store.persisted) return;
    try { window.localStorage.setItem(LOCAL_KEY, JSON.stringify(store.mem)); } catch (e) { store.persisted = false; }
  }
  function useMemory() {
    loadLocal();
    store.mode = 'memory';
    store.demo = true;
    store.isAdmin = true;
    render();
  }
  (function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { useMemory(); return; }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (res) {
      store.db = res[0]; store.user = res[1];
      var u = store.user;
      return Promise.all([u ? u.id() : null, u ? u.canEdit() : false]);
    }).then(function (ids) {
      store.uid = ids[0];
      store.isAdmin = !!ids[1];
      if (!store.db || !store.uid) { useMemory(); return; }
      store.mode = 'db';
      var firstMine = true;
      store.db.doc('inquiries/' + store.uid).onSnapshot(function (snap) {
        store.myDoc = snap.exists ? snap.data() : null;
        var r = parseRoute().name;
        if (firstMine || r === 'projects' || r === 'quote') render();
        firstMine = false;
      }, function () { toast('문의 내역을 불러오지 못했습니다. 새로고침해 주세요.'); });
      if (store.isAdmin) {
        store.db.collection('inquiries').onSnapshot(function (qs) {
          store.adminDocs = qs.docs.map(function (d) { return { uid: d.id, data: d.data() }; });
          if (parseRoute().name === 'admin') render();
        }, function () { toast('관리자 목록을 불러오지 못했습니다.'); });
      }
      render();
    }).catch(function () { useMemory(); });
  })();
})();
</script>
</body>
</html>
